<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test GitHub API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; border-radius: 4px; }
        .success { background-color: #dff0d8; color: #3c763d; }
        .error { background-color: #f2dede; color: #a94442; }
    </style>
</head>
<body>
<div class="container">
    <h1>GitHub API Test</h1>
    
    <div class="test-section">
        <h3>Test 1: Basic API Access</h3>
        <input type="text" id="token1" placeholder="Your GitHub Token">
        <button onclick="testBasicAccess()">Test Basic Access</button>
        <div id="result1"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 2: Gist Access</h3>
        <input type="text" id="token2" placeholder="Your GitHub Token">
        <input type="text" id="gistId" placeholder="Gist ID">
        <button onclick="testGistAccess()">Test Gist Access</button>
        <div id="result2"></div>
    </div>
</div>

<script>
function testBasicAccess() {
    const token = document.getElementById('token1').value;
    const resultDiv = document.getElementById('result1');
    
    resultDiv.innerHTML = '<div class="result">Testing...</div>';
    
    fetch('https://api.github.com/user', {
        headers: {
            'Authorization': `token ${token}`
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        resultDiv.innerHTML = `<div class="result success">Success! Logged in as ${data.login}</div>`;
    })
    .catch(error => {
        resultDiv.innerHTML = `<div class="result error">Error: ${error.message}</div>`;
    });
}

function testGistAccess() {
    const token = document.getElementById('token2').value;
    const gistId = document.getElementById('gistId').value;
    const resultDiv = document.getElementById('result2');
    
    resultDiv.innerHTML = '<div class="result">Testing...</div>';
    
    fetch(`https://api.github.com/gists/${gistId}`, {
        headers: {
            'Authorization': `token ${token}`
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        const files = Object.keys(data.files);
        resultDiv.innerHTML = `<div class="result success">Success! Found ${files.length} file(s): ${files.join(', ')}</div>`;
    })
    .catch(error => {
        resultDiv.innerHTML = `<div class="result error">Error: ${error.message}</div>`;
    });
}
</script>
</body>
</html>
